name: transaction-center
services:
  trade-console:
    build:
      context: ..
      dockerfile: deploy/console.Dockerfile
      target: ${TRADE_CONSOLE_BUILD_TARGET:-runtime}
    ports:
      - "127.0.0.1:${TRADE_CONSOLE_HOST_PORT:-4180}:8080"
    depends_on:
      trade-api:
        condition: service_healthy
    networks: [dev-infra]
    restart: unless-stopped
  trade-api:
    build: &trade-build
      context: ..
      dockerfile: deploy/Dockerfile
      target: ${TRADE_BUILD_TARGET:-runtime}
      args:
        TRADE_JAVA_IMAGE: ${TRADE_JAVA_IMAGE:-eclipse-temurin:21-jre}
    ports:
      - "127.0.0.1:${TRADE_HOST_PORT:-8400}:8400"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment: &trade-environment
      SPRING_PROFILES_ACTIVE: ${TRADE_SPRING_PROFILES:-}
      TRADE_BIND: 0.0.0.0
      TRADE_DB_URL: ${TRADE_DB_URL:-jdbc:mysql://infra-mysql84:3306/transaction_center?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
      TRADE_DB_USER: ${TRADE_DB_USER:?required}
      TRADE_DB_PASSWORD: ${TRADE_DB_PASSWORD:?required}
      TRADE_MIGRATION_USER: ${TRADE_MIGRATION_USER:?required}
      TRADE_MIGRATION_PASSWORD: ${TRADE_MIGRATION_PASSWORD:?required}
      TRADE_JWT_ISSUER: ${TRADE_JWT_ISSUER:?required}
      TRADE_JWT_JWKS: ${TRADE_JWT_JWKS:?required}
      TRADE_JWT_AUDIENCE: ${TRADE_JWT_AUDIENCE:-transaction-center}
      # 缓存使用项目专用ACL，默认关闭；故障回源与热点预算按API实例限制。
      TRADE_CATALOG_CACHE_ENABLED: ${TRADE_CATALOG_CACHE_ENABLED:-false}
      TRADE_CATALOG_CACHE_ENVIRONMENT: ${TRADE_CATALOG_CACHE_ENVIRONMENT:-dev}
      TRADE_CATALOG_REDIS_HOST: infra-redis7
      TRADE_CATALOG_REDIS_PORT: "6379"
      TRADE_CATALOG_REDIS_USER: ${TRADE_CATALOG_REDIS_USER:-}
      TRADE_CATALOG_REDIS_PASSWORD: ${TRADE_CATALOG_REDIS_PASSWORD:-}
      TRADE_CATALOG_REDIS_IO_LIMIT: ${TRADE_CATALOG_REDIS_IO_LIMIT:-32}
      TRADE_CATALOG_REDIS_TIMEOUT_MS: ${TRADE_CATALOG_REDIS_TIMEOUT_MS:-50}
      TRADE_CATALOG_QUERY_MAX_KEYS: ${TRADE_CATALOG_QUERY_MAX_KEYS:-1024}
      TRADE_CATALOG_QUERY_DB_CONCURRENCY: ${TRADE_CATALOG_QUERY_DB_CONCURRENCY:-2}
      TRADE_CATALOG_QUERY_DB_RATE: ${TRADE_CATALOG_QUERY_DB_RATE:-64}
      TRADE_CATALOG_QUERY_WAIT_MS: ${TRADE_CATALOG_QUERY_WAIT_MS:-150}
      TRADE_HOT_SKU_PERMITS: ${TRADE_HOT_SKU_PERMITS:-32}
      TRADE_HOT_SKU_MAX_KEYS: ${TRADE_HOT_SKU_MAX_KEYS:-4096}
      TRADE_FULFILLMENT_ENABLED: ${TRADE_FULFILLMENT_ENABLED:-false}
      TRADE_FULFILLMENT_ALLOWED_DELIVERY_ACTOR_KEYS: ${TRADE_FULFILLMENT_ALLOWED_DELIVERY_ACTOR_KEYS:-}
      TRADE_FULFILLMENT_ALLOWED_COMPLETION_ACTOR_KEYS: ${TRADE_FULFILLMENT_ALLOWED_COMPLETION_ACTOR_KEYS:-}
      TRADE_FULFILLMENT_ALLOWED_RETURN_ACTOR_KEYS: ${TRADE_FULFILLMENT_ALLOWED_RETURN_ACTOR_KEYS:-}
      # 开发环境按需注入，不能把真实密钥写进Compose或提交到仓库。
      TRADE_ADDRESS_KEY_BASE64: ${TRADE_ADDRESS_KEY_BASE64:-}
      TRADE_ADDRESS_KEY_VERSION: ${TRADE_ADDRESS_KEY_VERSION:-}
      TRADE_ORDER_TTL_SECONDS: ${TRADE_ORDER_TTL_SECONDS:-900}
      TRADE_CALLBACK_ACTIVE_KEY_VERSION: ${TRADE_CALLBACK_ACTIVE_KEY_VERSION:-}
      TRADE_CALLBACK_KEYS: ${TRADE_CALLBACK_KEYS:-}
      # 可信流程签署与联调前保持关闭；这里只传托管验证配置，不放签名私钥。
      TRADE_REFUND_APPROVAL_ENABLED: ${TRADE_REFUND_APPROVAL_ENABLED:-false}
      TRADE_REFUND_APPROVAL_ISSUER: ${TRADE_REFUND_APPROVAL_ISSUER:-}
      TRADE_REFUND_APPROVAL_JWKS: ${TRADE_REFUND_APPROVAL_JWKS:-}
      TRADE_REFUND_APPROVAL_AUDIENCE: ${TRADE_REFUND_APPROVAL_AUDIENCE:-}
      TRADE_REFUND_APPROVAL_SERVICE_SUBJECT: ${TRADE_REFUND_APPROVAL_SERVICE_SUBJECT:-}
      # 原生证据服务入口默认关闭，只配置经授权的服务身份摘要。
      TRADE_RECONCILIATION_QUERY_ENABLED: ${TRADE_RECONCILIATION_QUERY_ENABLED:-false}
      TRADE_RECONCILIATION_REPORT_ENABLED: ${TRADE_RECONCILIATION_REPORT_ENABLED:-false}
      TRADE_RECONCILIATION_REPORT_ALLOWED_ACTOR_KEYS: ${TRADE_RECONCILIATION_REPORT_ALLOWED_ACTOR_KEYS:-}
      TRADE_RECONCILIATION_REPORT_SOURCE_ID: ${TRADE_RECONCILIATION_REPORT_SOURCE_ID:-recon-platform}
      TRADE_RECONCILIATION_ENABLED: ${TRADE_RECONCILIATION_ENABLED:-false}
      TRADE_RECONCILIATION_ALLOWED_ACTOR_KEYS: ${TRADE_RECONCILIATION_ALLOWED_ACTOR_KEYS:-}
      TRADE_EVIDENCE_ENABLED: ${TRADE_EVIDENCE_ENABLED:-false}
      TRADE_EVIDENCE_ALLOWED_ACTOR_KEYS: ${TRADE_EVIDENCE_ALLOWED_ACTOR_KEYS:-}
      # API角色固定不领取后台任务；worker角色须使用显式profile启动。
      TRADE_WORKER_ENABLED: "false"
      TRADE_OUTBOX_ENABLED: "false"
      TRADE_OUTBOX_MAINTENANCE_ENABLED: "false"
    networks: [dev-infra]
    restart: unless-stopped
  trade-worker:
    profiles: [worker]
    build: *trade-build
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      <<: *trade-environment
      # 不发布宿主端口，监听回环，避免worker角色成为另一个业务入口。
      TRADE_BIND: 127.0.0.1
      TRADE_CATALOG_CACHE_ENABLED: "false"
      TRADE_FULFILLMENT_ENABLED: "false"
      TRADE_WORKER_ENABLED: "true"
      TRADE_OUTBOX_ENABLED: ${TRADE_OUTBOX_ENABLED:-false}
      TRADE_OUTBOX_MAINTENANCE_ENABLED: ${TRADE_OUTBOX_MAINTENANCE_ENABLED:-false}
      TRADE_OUTBOX_MAINTENANCE_PAGE_SIZE: ${TRADE_OUTBOX_MAINTENANCE_PAGE_SIZE:-100}
      TRADE_OUTBOX_MAINTENANCE_INTERVAL_MILLIS: ${TRADE_OUTBOX_MAINTENANCE_INTERVAL_MILLIS:-300000}
      TRADE_OUTBOX_MAINTENANCE_TICK_MILLIS: ${TRADE_OUTBOX_MAINTENANCE_TICK_MILLIS:-200}
      TRADE_OUTBOX_BOOTSTRAP_SERVERS: ${TRADE_OUTBOX_BOOTSTRAP_SERVERS:-infra-kafka38:9092}
      TRADE_OUTBOX_TOPIC_PREFIX: ${TRADE_OUTBOX_TOPIC_PREFIX:-}
      TRADE_WORKER_OUTBOX_THREADS: ${TRADE_WORKER_OUTBOX_THREADS:-1}
      TRADE_REFUND_APPROVAL_ENABLED: "false"
      TRADE_RECONCILIATION_QUERY_ENABLED: ${TRADE_RECONCILIATION_QUERY_ENABLED:-false}
      TRADE_WORKER_QUERY_THREADS: ${TRADE_WORKER_QUERY_THREADS:-1}
      TRADE_RECONCILIATION_REPORT_ENABLED: "false"
      TRADE_RECONCILIATION_ENABLED: "false"
      TRADE_EVIDENCE_ENABLED: "false"
      TRADE_WORKER_CALLBACK_THREADS: ${TRADE_WORKER_CALLBACK_THREADS:-2}
      TRADE_WORKER_PAYMENT_THREADS: ${TRADE_WORKER_PAYMENT_THREADS:-1}
      TRADE_WORKER_ORDER_THREADS: ${TRADE_WORKER_ORDER_THREADS:-1}
      TRADE_WORKER_REFUND_CALLBACK_THREADS: ${TRADE_WORKER_REFUND_CALLBACK_THREADS:-1}
      TRADE_WORKER_COMPENSATION_THREADS: ${TRADE_WORKER_COMPENSATION_THREADS:-1}
      TRADE_WORKER_REFUND_RECOVERY_THREADS: ${TRADE_WORKER_REFUND_RECOVERY_THREADS:-1}
      TRADE_WORKER_IDLE_MILLIS: ${TRADE_WORKER_IDLE_MILLIS:-250}
      TRADE_WORKER_SHUTDOWN_MILLIS: ${TRADE_WORKER_SHUTDOWN_MILLIS:-30000}
    # 大于后台30秒最大收尾预算，预留Spring生命周期与进程退出时间。
    stop_grace_period: 60s
    networks: [dev-infra]
    restart: unless-stopped
networks:
  dev-infra:
    external: true
    name: ${DEV_INFRA_NETWORK:-dev-infra}

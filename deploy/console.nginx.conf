worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    server {
        listen 8080;
        root /usr/share/nginx/html;
        location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
        location /api/ {
            proxy_pass http://trade-api:8400;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location = /config.js { add_header Cache-Control "no-store"; }
        location /assets/ { try_files $uri =404; }
        # 登录回调与前端深层路由都由SPA处理。
        location / { add_header Cache-Control "no-cache"; try_files $uri $uri/ /index.html; }
    }
}

name: Verify transaction center

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/contracts/requirements.txt
      - name: Install locked contract dependencies
        run: python -m pip install --require-hashes -r scripts/contracts/requirements.txt
      - name: Verify Compose configuration without secrets
        run: python3 scripts/verify-compose-config.py
      - name: Verify with isolated MySQL
        # Testcontainers启动隔离数据库；不读取共享基础设施或生产凭据。
        run: bash scripts/verify.sh > build-ci.log 2>&1
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-evidence
          retention-days: 7
          path: |
            build-ci.log
            **/target/surefire-reports/*.xml
            **/target/failsafe-reports/*.xml

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend/apps/console
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/apps/console/pnpm-lock.yaml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Browser UI contract tests (intercepted API)
        run: pnpm e2e
      - name: Real backend, MySQL and OIDC browser integration
        working-directory: .
        run: bash scripts/verify-console-integration.sh > build-console-integration.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-browser-evidence
          retention-days: 7
          path: |
            frontend/apps/console/playwright-report/
            frontend/apps/console/test-results/
            transaction-server/target/console-integration/
            transaction-server/target/surefire-reports/
            build-console-integration.log

  multi-instance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Isolated API and worker process fault verification
        run: bash scripts/verify-multi-instance.sh > build-multi-instance.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: multi-instance-evidence
          retention-days: 7
          path: |
            build-multi-instance.log
            transaction-server/target/multi-instance/
            transaction-server/target/surefire-reports/

name: Verify transaction center

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/contracts/requirements.txt
      - name: Install locked contract dependencies
        run: python -m pip install --require-hashes -r scripts/contracts/requirements.txt
      - name: Verify with isolated MySQL
        # Testcontainers启动隔离数据库；不读取共享基础设施或生产凭据。
        run: bash scripts/verify.sh > build-ci.log 2>&1
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-evidence
          retention-days: 7
          path: |
            build-ci.log
            **/target/surefire-reports/*.xml
            **/target/failsafe-reports/*.xml
